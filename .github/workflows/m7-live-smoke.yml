name: M7 Live Staging Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-live-staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run M7 live staging smoke
        run: pnpm ai:smoke
        env:
          AI_SMOKE_CONFIRM: live
          AI_SMOKE_BASE_URL: https://rental-commerce-staging.lopjuancho.workers.dev
          AI_SMOKE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AI_SMOKE_PRODUCT: m7-smoke-test-castle
