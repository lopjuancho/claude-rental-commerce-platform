name: CI

on:
  pull_request:
  push:
    # Development happens on claude/* branches before any PR exists; they must be verified too.
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Secret guards
        run: bash scripts/check-secrets.sh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Start Supabase (Postgres + Auth + REST)
        run: pnpm exec supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor,mailpit
      - name: Export Supabase env
        # Newer CLIs print PUBLISHABLE_KEY/SECRET_KEY; older ones ANON_KEY/SERVICE_ROLE_KEY.
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "DATABASE_URL=${DB_URL}"
          } >> "$GITHUB_ENV"

      - name: Generated database types are up to date
        run: |
          pnpm exec supabase gen types typescript --local --schema public 2>/dev/null \
            | (echo "// GENERATED by scripts/gen-types.sh from the database schema. Do not edit." && pnpm exec prettier --stdin-filepath generated.ts) > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts

      - name: Integration tests (RLS, tenancy, audit) against the Supabase stack
        run: pnpm test:integration
        env:
          SKIP_DB_SETUP: "1"

      - run: pnpm build
        env:
          APP_ENV: development

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke tests
        run: pnpm test:e2e
        env:
          E2E_START_SERVER: "1"
          APP_ENV: development

      - name: Cloudflare Workers bundle builds
        run: pnpm exec opennextjs-cloudflare build
